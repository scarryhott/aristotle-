name: Verify formal and experimental kernels

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exhaustive closure tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate static relational-return audit
        run: python3 experiments/aristotle_d4_closure.py --assert-reference
      - name: Replay independent full-stack runtime
        run: python3 experiments/full_stack_math_asi.py --assert-reference > /tmp/full_stack_result.json
      - name: Require deterministic committed receipts
        run: git diff --exit-code -- runs/full_stack_d4/latest

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
